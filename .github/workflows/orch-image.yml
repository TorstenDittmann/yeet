name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: yeet-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.ORCH_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: TorstenDittmann/orch@v0.1.12
        with:
          cluster: ${{ vars.ORCH_CLUSTER }}
          version: ${{ vars.ORCH_VERSION }}
          app: yeet
          image: ghcr.io/torstendittmann/yeet
          context: packages/server
          platforms: linux/amd64
          file: infrastructure/orch.pkl
